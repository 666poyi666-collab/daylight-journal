name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run build
      - name: Validate PowerShell service assets
        shell: pwsh
        run: |
          $errors = @()
          Get-ChildItem mcp -Recurse -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $fileErrors = $null
            [void][Management.Automation.Language.Parser]::ParseFile(
              $_.FullName, [ref]$tokens, [ref]$fileErrors)
            $errors += $fileErrors
          }
          if ($errors.Count) { $errors | Format-List; exit 1 }
